<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>당장만나 (모의 앱 v4.1)</title>

<style>
/* v3.0 색상: PwC 강조 1~3 + 따뜻한 갈색 보조색, 주황 박스 위 흰 글자 (라이트 테마 전용) */
:root{
  --primary:#FE7C39; --primary-press:#FD5108; --accent1:#FD5108; --peach:#FFAA72;
  --peach-soft:#FFE3D1; --page:#FFF4EC; --card:#FFFFFF; --line:#F1E4DA;
  --brown:#4A2716; --accent:#C2541A; --on-soft:#A33F00;
  --sky:#2F6FD6; --rose:#C8344E; --disabled:#C9BDB4;
  --text:#2B1E16; --text2:#7A6A5F;
  --like-bg:#E6F4EC; --like:#2A7353; --dis-bg:#FDECEF;
  --t-peach:#FFE3D1; --t-mint:#DDF2E6; --t-sky:#DDEBFB; --t-lilac:#EEE4FB; --t-butter:#FFF1C9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#FFF4EC; --text:#2B1E16; } }
:root[data-theme="dark"]{ --page:#FFF4EC; --text:#2B1E16; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR",sans-serif;background:var(--page);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;background:var(--page)}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.fixed{height:100vh;height:100dvh;overflow:hidden}
.head{display:flex;align-items:center;gap:6px;padding:14px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--page);z-index:5}
.head h1{font-size:20px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:26px;line-height:1;width:30px;height:30px;color:var(--text2)}
.body{padding:8px 16px 28px;display:flex;flex-direction:column;gap:12px;flex:1}

.btn{height:54px;border-radius:999px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;width:100%;padding:0 16px;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(254,124,57,.28)}
.btn-primary:active{background:var(--primary-press)}
.btn-soft{background:var(--peach-soft);color:var(--on-soft)}
.btn-ghost{height:44px;font-size:14px;font-weight:600;color:var(--text2);border:1.5px dashed var(--line);background:rgba(255,255,255,.6)}
.btn-sm{height:34px;padding:0 16px;border-radius:999px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;flex-shrink:0}

.label{font-size:15px;font-weight:700;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:16px;font-weight:600;color:var(--text2)}
.field label small{font-size:14px;font-weight:400}
.inp{height:54px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:0 18px;font-size:17px;width:100%}
.inp::placeholder{color:#A0918A;font-size:16px}
.err{font-size:14px;color:var(--rose)}
.hint{font-size:13px;color:var(--text2);padding-left:4px}

.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(122,74,40,.06)}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .ttl{font-size:16px;font-weight:700;flex:1}
.tile{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile svg{width:18px;height:18px}
.more{font-size:14px;color:var(--text2);padding:4px 0 4px 8px}
.r1{font-size:18px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px}
.rn{font-size:14px;color:var(--text2)}
.nw{white-space:nowrap}
.badge{background:var(--primary);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{height:46px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--text);white-space:nowrap;width:100%}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.chip.on.dark{background:var(--brown);border-color:var(--brown)}
/* v3.1 항목별 선택 색: 날짜·시간=주황, 장소=하늘, 희망=민트, 기피=로즈, 음주=라벤더 */
.c-time .chip.on{background:#FFE3D1;border:1.5px solid #FFAA72;color:#A33F00}
.c-place .chip.on{background:#DDEBFB;border:1.5px solid #8DB4EE;color:#2F65BF}
.c-like .chip.on{background:#DDF2E6;border:1.5px solid #86CDA6;color:#23784F}
.c-dis .chip.on{background:#FDE3E8;border:1.5px solid #EE9AAA;color:#B83A52}
.c-drink .chip.on{background:#EEE4FB;border:1.5px solid #B9A0EC;color:#6A45B0}
.label.l-place{color:#2F65BF}.label.l-like{color:#23784F}.label.l-dis{color:#B83A52}.label.l-drink{color:#7046C2}
.sec{background:var(--card);border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(122,74,40,.06)}
.sec .label{padding-left:4px}
.chip:disabled{color:#B3A49A;background:#FBF6F2;border-color:#F1E4DA;cursor:default}
.chip.sym{font-size:20px}
.idchip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}

/* 01 */
.entry{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#FFF4EC,#FFF4EC)}
.hero{position:relative;width:100%;height:min(440px,52vh);flex-shrink:0;overflow:hidden}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(rgba(255,244,236,0),var(--page))}
.entry-main{flex:1;display:flex;flex-direction:column;padding:0 20px;gap:12px;min-height:0}
.entry-main h2{font-size:26px;font-weight:700;line-height:1.35;text-align:center;margin:10px 0 8px}
.entry-main h2 span{display:block;color:var(--accent)}
.brand{text-align:center;margin-top:auto;padding:6px 0 20px}
.brand b{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:52px;color:var(--primary);text-shadow:3px 3px 0 var(--brown);line-height:1.1;display:inline-block}
.brand b i{font-style:normal;display:inline-block}
.brand b i:nth-child(odd){transform:rotate(-4deg)}
.brand b i:nth-child(even){transform:rotate(3deg) translateY(2px);color:var(--peach)}
.brand p{font-size:13px;color:var(--text2);margin-top:2px}

/* 02 */
.box{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;height:84px;box-shadow:0 2px 10px rgba(122,74,40,.06)}
.box .k{font-size:14px;color:var(--text2);font-weight:500}
.box .v{font-size:20px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box>div{min-width:0}
.note{font-size:15px;font-weight:600;color:var(--accent);text-align:center}
.note2{font-size:14px;color:var(--text2);text-align:center}

/* 04 */
.section-t{font-size:21px;font-weight:700}
.calcard{background:var(--card);border-radius:22px;padding:14px 12px;box-shadow:0 2px 10px rgba(122,74,40,.06);display:flex;flex-direction:column;gap:8px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;padding:0 4px}
.cal-nav span{color:var(--disabled);font-weight:400;padding:0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:14px;color:var(--text2);font-weight:500}
.wd.sun,.day.sun{color:var(--rose)} .wd.sat,.day.sat{color:var(--sky)}
.day{height:46px;border-radius:14px;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:700}
.day.has{background:var(--peach-soft)}
.day.act{border-color:var(--primary)}
.dots{display:flex;flex-direction:column;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--primary);display:block}
.dot.f{background:var(--primary)}
.slot-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.slot-row b{font-size:17px}
.legend{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.drink-msg{font-size:14px;color:#5E3BA6;background:#F7F2FE;border-radius:14px;padding:10px 14px;text-align:center;font-weight:600}

/* 05 */
.idrow{display:flex;align-items:center;gap:6px}
.idrow .cnt{margin-left:auto;font-size:14px;color:var(--text2);white-space:nowrap}
.mbox{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.mbox.like{background:var(--like-bg)} .mbox.like b{color:var(--like)}
.mbox.dis{background:var(--dis-bg)} .mbox.dis b{color:var(--rose)}
.mbox b{font-size:14px;margin-bottom:2px}
.mrow{display:flex;flex-direction:column;line-height:1.45}
.mtie{font-size:12px;font-weight:700;opacity:.75}
.dtile{border-radius:999px;background:var(--page);height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:700}
.dtile span{font-weight:500;color:var(--text2);font-size:14px}
.dtile.top{background:var(--primary);color:#fff}.dtile.top span{color:#fff}
.rec{font-size:14px;color:var(--text2);text-align:center;padding:2px 0}
.rec u{text-underline-offset:3px}
.notecard .ttl{color:var(--text)}
.notecard li{font-size:14px;color:var(--text);list-style:none;padding:3px 0}
.notecard li b{font-weight:600}
.sum{background:#F2F5FC;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.75}
.sum .st{font-weight:700;margin-bottom:6px}
.sum .sl{font-weight:700;margin-top:6px}
.sum .si{padding-left:14px}
.sum .link{margin-top:8px;color:var(--text2);overflow-wrap:anywhere}

/* 팝업·시트·토스트 */
.dim{position:fixed;inset:0;background:rgba(43,30,22,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.pop{background:var(--card);border-radius:24px;padding:30px 20px 18px;max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:20px}
.pop p{font-size:19px;font-weight:700}
.dim.sheet{align-items:flex-end;padding:0}
.sheet-box{background:var(--card);border-radius:24px 24px 0 0;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-box h3{font-size:19px;margin-bottom:4px}
.sheet-sec{font-size:15px;font-weight:700;margin:14px 0 2px}
.rk{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rk-t{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rk-t em{font-style:normal;font-size:14px;color:var(--text2);font-weight:500}
.voters{display:flex;flex-wrap:wrap;gap:6px}
.voters .idchip{background:var(--page);border-color:var(--page)}
.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet-box{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}.drink-msg{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(-4px)}}}
</style>
</head>

<script>
/* ===== 데이터 (화면별_샘플데이터_v3.0.json과 같은 내용) ===== */
const DATA = {"config": {"PLACES": ["강남", "잠실", "여의도", "성수", "종로", "홍대", "용산", "이태원", "문래"], "MENUS": ["한식", "중식", "양식", "일식", "아시안", "멕시칸", "샐러드"], "SLOTS": ["점심", "저녁"], "DRINK": [{"value": "O", "label": "○", "message": "오늘은 달려봐요! 끝까지 함께할게요 🍻"}, {"value": "△", "label": "△", "message": "분위기 보고 가볍게 한두 잔 할게요"}, {"value": "X", "label": "✕", "message": "오늘은 쉬어갈게요. 음료로 건배해요 🥤"}], "MENU_DB": {"한식": [["보쌈", []], ["김치찌개", ["매운"]], ["닭갈비", ["밀", "매운"]], ["비빔밥", ["계란"]], ["해물파전", ["갑각류", "조개류", "밀", "계란"]]], "중식": [["짜장면", ["밀"]], ["마라탕", ["땅콩", "밀", "매운"]], ["탕수육", ["밀", "계란"]], ["딤섬", ["밀", "갑각류"]]], "양식": [["스테이크", []], ["파스타", ["밀", "우유"]], ["리조또", ["우유"]], ["피자", ["밀", "우유"]]], "일식": [["규동", []], ["초밥", ["갑각류", "조개류"]], ["돈카츠", ["밀", "계란"]], ["라멘", ["밀", "계란"]]], "아시안": [["쌀국수", []], ["분짜", ["땅콩"]], ["팟타이", ["땅콩", "갑각류", "계란"]], ["똠얌꿍", ["갑각류", "매운"]]], "멕시칸": [["타코", ["밀"]], ["부리토", ["밀", "우유"]], ["퀘사디아", ["밀", "우유"]], ["나초", ["우유"]]], "샐러드": [["포케", []], ["연어샐러드", []], ["리코타 샐러드", ["우유"]], ["견과류 샐러드볼", ["견과류", "땅콩"]]]}}, "meeting": {"name": "콘텐츠팀 회식", "code": "K7M2Q9", "inviteLink": "https://…/k7m2q9", "hostId": "조서윤2493", "createdAt": "2026-10-12T09:30:00+09:00", "responseMonth": "2026-10"}, "participants": [{"id": "조서윤2493", "isHost": true, "note": "", "slots": ["2026-10-16|저녁", "2026-10-23|저녁", "2026-10-30|점심"], "places": ["강남", "성수"], "likes": ["한식", "일식"], "dislikes": ["중식"], "drink": "O"}, {"id": "김민준3184", "isHost": false, "note": "갑각류 알레르기가 있어요", "slots": ["2026-10-16|저녁", "2026-10-22|저녁", "2026-10-23|저녁"], "places": ["강남", "여의도", "성수"], "likes": ["한식", "양식", "일식"], "dislikes": ["멕시칸"], "drink": "O"}, {"id": "이서현5521", "isHost": false, "note": "매운 음식은 잘 못 먹어요", "slots": ["2026-10-23|저녁", "2026-10-30|점심"], "places": ["성수", "종로"], "likes": ["일식", "아시안"], "dislikes": ["중식", "멕시칸"], "drink": "△"}, {"id": "박도윤7709", "isHost": false, "note": "", "slots": ["2026-10-16|저녁", "2026-10-22|저녁", "2026-10-23|저녁"], "places": ["강남", "홍대"], "likes": ["한식", "중식", "멕시칸"], "dislikes": ["샐러드"], "drink": "O"}, {"id": "최하린2046", "isHost": false, "note": "땅콩 알레르기가 있어요", "slots": ["2026-10-23|저녁", "2026-10-30|점심"], "places": ["여의도", "강남"], "likes": ["한식", "샐러드", "일식"], "dislikes": ["중식"], "drink": "X"}, {"id": "정우진8832", "isHost": false, "note": "", "slots": ["2026-10-16|저녁", "2026-10-22|저녁", "2026-10-23|저녁", "2026-10-24|저녁"], "places": ["강남", "성수", "이태원"], "likes": ["한식", "양식"], "dislikes": ["아시안"], "drink": "O"}, {"id": "강지아4415", "isHost": false, "note": "우유가 들어간 음식은 피하고 있어요", "slots": ["2026-10-16|저녁", "2026-10-23|저녁"], "places": ["성수", "종로"], "likes": ["아시안", "일식"], "dislikes": ["양식", "중식"], "drink": "△"}, {"id": "윤시우6290", "isHost": false, "note": "", "slots": ["2026-10-22|저녁", "2026-10-23|저녁", "2026-10-30|점심"], "places": ["종로", "강남"], "likes": ["한식", "아시안", "멕시칸"], "dislikes": ["샐러드"], "drink": "O"}, {"id": "한예린1357", "isHost": false, "note": "마라탕은 못 먹어요", "slots": ["2026-10-16|저녁", "2026-10-23|저녁"], "places": ["성수", "여의도", "문래"], "likes": ["한식", "일식", "양식"], "dislikes": ["중식", "멕시칸"], "drink": "△"}, {"id": "오지훈9064", "isHost": false, "note": "조개류 알레르기가 있어요", "slots": ["2026-10-16|저녁", "2026-10-23|저녁", "2026-10-31|점심"], "places": ["강남", "용산"], "likes": ["한식", "중식"], "dislikes": ["아시안"], "drink": "X"}]};
const {PLACES,MENUS,SLOTS,DRINK,MENU_DB} = DATA.config;
const YEAR=2026, MONTH=10, WD=["일","월","화","수","목","금","토"];

const S={screen:"home",meeting:null,draft:null,activeDay:null,err:{},notesOpen:false,recIdx:0};
const genCode=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const newMeeting=(name,code=genCode())=>({name,code,link:`https://…/${code.toLowerCase()}`,people:[]});

/* ===== 집계 ===== */
const dateOf=k=>{const [y,m,d]=k.split("|")[0].split("-").map(Number);return new Date(y,m-1,d);};
function slotLabel(k){const dt=dateOf(k);return `${dt.getMonth()+1}/${String(dt.getDate()).padStart(2,"0")}(${WD[dt.getDay()]}) ${k.split("|")[1]}`;}
const dayKey=(m,d)=>`${YEAR}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function rank(counts,order){
  const arr=Object.entries(counts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]||order(a[0],b[0]));
  const gs=[]; arr.forEach(([k,v])=>{const r=1+arr.filter(([,w])=>w>v).length; if(r>3)return;
    let g=gs.find(g=>g.rank===r); if(!g){g={rank:r,votes:v,items:[]};gs.push(g);} g.items.push(k);});
  gs.forEach(g=>g.label=(g.items.length>1?"공동 ":"")+g.rank+"위"); return gs;
}
const byList=L=>(a,b)=>L.indexOf(a)-L.indexOf(b);
function tally(f){const c={};S.meeting.people.forEach(p=>p[f].forEach(x=>c[x]=(c[x]||0)+1));return c;}
const voters=(f,it)=>S.meeting.people.filter(p=>p[f].includes(it)).map(p=>p.id);
function results(){
  const ppl=S.meeting.people, drink={}; DRINK.forEach(d=>drink[d.value]=ppl.filter(p=>p.drink===d.value).length);
  return {n:ppl.length, dates:rank(tally("slots"),(a,b)=>a<b?-1:1), places:rank(tally("places"),byList(PLACES)),
    likes:rank(tally("likes"),byList(MENUS)), dislikes:rank(tally("dislikes"),byList(MENUS)), drink,
    notes:ppl.filter(p=>p.note).map(p=>({id:p.id,note:p.note}))};
}
function recommendations(R){ if(!R.likes.length) return []; const t=R.notes.map(x=>x.note).join(" ");
  return R.likes[0].items.flatMap(c=>(MENU_DB[c]||[]).filter(([nm,tags])=>!tags.some(x=>t.includes(x))&&!t.includes(nm)).map(([nm])=>nm)); }
function summaryLines(R){
  const L=[["t",`[${S.meeting.name}] 모임 결과 요약 (${R.n}명 참여)`]];
  L.push(["l","날짜"]); R.dates.forEach(g=>L.push(["i",`${g.label} ${g.items.map(slotLabel).join(" · ")} (${g.votes}표)`+(g.rank===1&&g.votes===R.n?" [만장일치]":"")]));
  if(R.places.length){L.push(["l","장소"]); R.places.forEach(g=>L.push(["i",`${g.label} ${g.items.join(" · ")} (${g.votes}표)`]));}
  const lk=R.likes.filter(g=>g.rank<=2).flatMap(g=>g.items).join(", "), dk=R.dislikes.length?R.dislikes[0].items.join(", "):"";
  if(lk||dk){L.push(["l","메뉴"]); if(lk)L.push(["i",`좋아요 ${lk}`]); if(dk)L.push(["i",`싫어요 ${dk}`]);}
  const d=Object.entries(R.drink).filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}`).join(" · ");
  L.push(["l","술자리"],["i",d||"응답 없음"],["u",`상세 결과 보기: ${S.meeting.link}`]); return L;
}
const summaryText=R=>{const L=summaryLines(R);return L.map(([t,s],i)=>t==="i"?"  "+s:(t==="l"&&L[i-1][0]==="t"?"\n"+s:t==="u"?"\n"+s:s)).join("\n");};

V.create=()=>{const m=S.meeting&&S.meeting._fresh?S.meeting:null;return `<div class="screen fixed">${head("새로운 모임 만들기","home")}
<div class="body" style="gap:20px;padding-top:16px">
  <div class="field"><label for="mname">모임 이름</label><input id="mname" class="inp" placeholder="예: 팀 회식" value="${esc(S.draftName||"")}" oninput="S.draftName=this.value"></div>
  ${S.err.name?`<p class="err">${S.err.name}</p>`:""}
  <button class="btn btn-primary" onclick="makeLink()">초대장 링크 생성</button>
  ${m?`<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
    <div class="box"><div><p class="k">모임 코드 (6자리)</p><p class="v">${m.code}</p></div><button class="btn-sm" onclick="copy('${m.code}',this)">복사</button></div>
    <div class="box"><div><p class="k">초대 링크</p><p class="v">${esc(m.link)}</p></div><button class="btn-sm" onclick="copy('${esc(m.link)}',this)">복사</button></div>
    <p class="note" style="margin-top:4px">복사해서 모임 참여자에게 전달하세요</p>
  </div>
  <div style="margin-top:40px;display:flex;flex-direction:column;gap:10px">
    <button class="btn btn-soft" onclick="go('join')">초대 링크로 입장하기</button>
    <p class="note2">방장님도 초대 링크로 입장해서 투표해 주세요</p>
  </div>`:""}
</div></div>`;};

V.join=()=>`<div class="screen fixed">${head("초대장 열기","home")}
<div class="body" style="gap:22px;padding-top:20px">
  <div class="field"><label for="jcode">모임 코드</label><input id="jcode" class="inp" maxlength="6" placeholder="예: A1B2C3" value="${esc(S.joinCode??(S.meeting?S.meeting.code:""))}" oninput="S.joinCode=this.value.toUpperCase();this.value=S.joinCode" autocapitalize="characters">${S.err.code?`<p class="err">${S.err.code}</p>`:""}</div>
  <div class="field"><label for="jid">참여자 ID <small>(이름 + 전화번호 뒷 4자리)</small></label><input id="jid" class="inp" placeholder="예: 조서윤2493" value="${esc(S.joinId||"")}" oninput="S.joinId=this.value.trim()">${S.err.id?`<p class="err">${S.err.id}</p>`:""}</div>
  <div class="field"><label for="jnote">확인해주세요 <small>(선택)</small></label><input id="jnote" class="inp" placeholder="예: 갑각류 알레르기, 마라탕 싫어요" value="${esc(S.joinNote||"")}" oninput="S.joinNote=this.value"><p class="hint">알레르기나 못 먹는 음식을 적어주시면 메뉴 추천에서 빼드려요</p></div>
  <button class="btn btn-primary" style="margin-top:6px" onclick="enter()">입장하기</button>
</div></div>`;

function calendar(){const d=S.draft,first=new Date(YEAR,MONTH-1,1).getDay(),days=new Date(YEAR,MONTH,0).getDate();
  let h=WD.map((w,i)=>`<div class="wd${i===0?" sun":i===6?" sat":""}">${w}</div>`).join("");
  for(let i=0;i<first;i++)h+="<div></div>";
  for(let day=1;day<=days;day++){const k=dayKey(MONTH,day),dow=new Date(YEAR,MONTH-1,day).getDay(),sel=SLOTS.map(s=>d.slots.includes(`${k}|${s}`));
    h+=`<button class="day${sel.some(Boolean)?" has":""}${S.activeDay===k?" act":""}${dow===0?" sun":dow===6?" sat":""}" onclick="pickDay('${k}')" aria-label="${MONTH}월 ${day}일"><span>${day}</span><span class="dots">${sel.map(f=>`<i class="dot${f?" f":""}"></i>`).join("")}</span></button>`;}
  return h;}
V.respond=()=>{const d=S.draft,ad=S.activeDay,adL=ad?slotLabel(ad+"|").replace(/\s$/,""):"날짜를 눌러 주세요";
  const chip=(f,v,dark)=>{const on=d[f].includes(v),o=f==="likes"?"dislikes":f==="dislikes"?"likes":null,dis=!on&&(d[f].length>=3||(o&&d[o].includes(v)));
    return `<button class="chip${on?" on":""}${on&&dark?" dark":""}" ${dis?"disabled":""} aria-pressed="${on}" onclick="tog('${f}','${v}')">${v}</button>`;};
  const dm=DRINK.find(x=>x.value===d.drink);
  return `<div class="screen">${head(S.meeting.name,"join")}
<div class="body" style="gap:14px">
  <h2 class="section-t">1. 날짜 선택</h2>
  <div class="calcard"><div class="cal-nav"><span aria-hidden="true">‹</span>${YEAR}년 ${MONTH}월<span aria-hidden="true">›</span></div><div class="cal">${calendar()}</div></div>
  <div class="slot-row"><b>${adL}</b><span class="rn">복수 선택 가능</span></div>
  <div class="grid2 c-time">${SLOTS.map(s=>{const on=ad&&d.slots.includes(`${ad}|${s}`);return `<button class="chip${on?" on":""}" ${ad?"":"disabled"} aria-pressed="${!!on}" onclick="togSlot('${s}')">${s}</button>`;}).join("")}</div>
  <div class="legend"><i class="dot"></i>→<i class="dot f"></i> 점심 · 저녁 (위부터)</div>
  <button class="btn btn-primary" onclick="document.getElementById('sec2').scrollIntoView({behavior:'smooth'})">다음</button>
  <h2 class="section-t" id="sec2" style="margin-top:20px;scroll-margin-top:70px">2. 장소와 메뉴</h2>
  <div class="sec c-place"><p class="label l-place">📍 희망 장소 (최대 3개)</p><div class="grid3">${PLACES.map(p=>chip("places",p)).join("")}</div></div>
  <div class="sec c-like"><p class="label l-like">🙂 희망 메뉴 (최대 3개)</p><div class="grid3">${MENUS.map(m=>chip("likes",m)).join("")}</div></div>
  <div class="sec c-dis"><p class="label l-dis">🙁 기피 메뉴 (최대 3개)</p><div class="grid3">${MENUS.map(m=>chip("dislikes",m)).join("")}</div></div>
  <div class="sec c-drink"><p class="label l-drink">🥂 음주 여부</p>
  <div class="grid3">${DRINK.map(x=>`<button class="chip sym${d.drink===x.value?" on":""}" aria-label="음주 ${x.value}" aria-pressed="${d.drink===x.value}" onclick="S.draft.drink=S.draft.drink==='${x.value}'?null:'${x.value}';keep()">${x.label}</button>`).join("")}</div>
  ${dm?`<p class="drink-msg" aria-live="polite">${esc(dm.message)}</p>`:""}</div>
  <button class="btn btn-primary" style="margin-top:12px" onclick="confirmResp()">확정하기</button>
</div></div>`;};

V.dash=()=>{const R=results(),M=S.meeting,recs=recommendations(R),ids=M.people.map(p=>p.id);
  const it=g=>g.items.map(x=>`<span class="nw">${esc(x)}</span>`).join(" · ");
  const list=(gs,lab,badge)=>gs.length?`<p class="r1">${gs[0].label} ${lab(gs[0])} (${gs[0].votes}표)${badge&&gs[0].votes===R.n?'<span class="badge">만장일치</span>':""}</p>${gs.slice(1).map(g=>`<p class="rn">${g.label} ${lab(g)} (${g.votes}표)</p>`).join("")}`:`<p class="rn">아직 응답이 없어요</p>`;
  const ml=gs=>gs.length?gs.map(g=>g.items.length>1?`<span class="mrow"><span class="mtie">${g.label}</span><span class="nw">${g.items.map(esc).join(" · ")} (${g.votes})</span></span>`:`<span class="mrow nw">${g.label} ${esc(g.items[0])} (${g.votes})</span>`).join(""):`<span class="rn">없음</span>`;
  const top=Math.max(...Object.values(R.drink)), rec=recs.length?recs[S.recIdx%recs.length]:null;
  const sl=summaryLines(R);
  return `<div class="screen">${head(M.name+" 대시보드","home")}
<div class="body">
  <div class="idrow">${ids.slice(0,2).map(i=>`<span class="idchip">${esc(i)}</span>`).join("")}${ids.length>2?`<span class="idchip">+${ids.length-2}</span>`:""}<span class="cnt">참여 ${R.n}명</span></div>
  <div class="card"><div class="card-h">${tile("cal","var(--t-peach)")}<span class="ttl">날짜</span><button class="more" onclick="detail('slots')">상세 ›</button></div>${list(R.dates,g=>g.items.map(slotLabel).join(" · "),true)}</div>
  <div class="card"><div class="card-h">${tile("pin","var(--t-sky)")}<span class="ttl">장소</span><button class="more" onclick="detail('places')">상세 ›</button></div>${list(R.places,it)}</div>
  <div class="card"><div class="card-h">${tile("fork","var(--t-mint)")}<span class="ttl">메뉴</span><button class="more" onclick="detail('menus')">상세 ›</button></div>
    <div class="grid2"><div class="mbox like"><b>🙂 이 메뉴는 좋아요</b>${ml(R.likes)}</div><div class="mbox dis"><b>🙁 이 메뉴는 싫어요</b>${ml(R.dislikes)}</div></div>
    ${rec?`<button class="rec" onclick="S.recIdx++;keep()">오늘은 이 메뉴 어때요? <u>${esc(rec)}</u></button>`:""}
  </div>
  <div class="card"><div class="card-h">${tile("cup","var(--t-lilac)")}<span class="ttl">오늘 술 한 잔?</span></div>
    ${top>0?`<div class="grid3">${DRINK.map(x=>`<div class="dtile${R.drink[x.value]===top?" top":""}">${x.value} <span>(${R.drink[x.value]}표)</span></div>`).join("")}</div>`:`<p class="rn">아직 응답이 없어요</p>`}
  </div>
  ${R.notes.length?`<div class="card notecard"><div class="card-h">${tile("bang","var(--t-butter)")}<span class="ttl">확인해주세요 ${R.notes.length}건</span><button class="more" onclick="S.notesOpen=!S.notesOpen;keep()" aria-expanded="${S.notesOpen}">${S.notesOpen?"접기":"전체 보기"}</button></div>
    <ul>${(S.notesOpen?R.notes:R.notes.slice(0,2)).map(x=>`<li><b>${esc(x.id)}</b> · ${esc(x.note)}</li>`).join("")}</ul></div>`:""}
  <div class="card"><div class="card-h">${tile("sum","#E6EBF7")}<span class="ttl">결과 요약</span><span class="rn" style="font-weight:700;color:var(--accent)">${R.n}명 참여</span></div>
    <div class="sum">${sl.map(([t,s])=>`<p class="${t==="t"?"st":t==="l"?"sl":t==="i"?"si":"link"}">${esc(s)}</p>`).join("")}</div>
    <button class="btn btn-primary" style="margin-top:4px" onclick="copy(summaryText(results()));toast('요약을 복사했어요. 단톡방에 붙여넣으세요')">단톡방에 공유하기</button>
  </div>
</div></div>`;};

/* ===== 동작 ===== */
function render(){document.getElementById("app").innerHTML=V[S.screen]();}
function keep(){const y=window.scrollY;render();window.scrollTo(0,y);}
function loadDemo(){const m=DATA.meeting;S.meeting=newMeeting(m.name,m.code);S.meeting.link=m.inviteLink;S.meeting.people=JSON.parse(JSON.stringify(DATA.participants));S.recIdx=0;S.notesOpen=false;go("dash");}
function openDash(){if(!S.meeting){toast("아직 만든 모임이 없어요. 새 모임을 만들거나 데모 데이터를 채워 보세요");return;}go("dash");}
function makeLink(){const n=(S.draftName||"").trim();if(!n){S.err={name:"모임 이름을 입력해 주세요"};render();return;}S.meeting=newMeeting(n);S.meeting._fresh=true;S.joinCode=S.meeting.code;render();}
function enter(){const code=(S.joinCode??(S.meeting?S.meeting.code:"")).trim(),id=(S.joinId||"").trim();S.err={};
  if(!S.meeting||code!==S.meeting.code)S.err.code="모임 코드를 다시 확인해 주세요";
  if(!/^[가-힣A-Za-z]{1,10}\d{4}$/.test(id))S.err.id="이름 뒤에 전화번호 뒷 4자리를 붙여 주세요 (예: 조서윤2493)";
  if(Object.keys(S.err).length){render();return;}
  const prev=S.meeting.people.find(p=>p.id===id);
  S.draft=prev?JSON.parse(JSON.stringify(prev)):{id,isHost:false,note:"",slots:[],places:[],likes:[],dislikes:[],drink:null};
  if(S.joinNote&&S.joinNote.trim())S.draft.note=S.joinNote.trim();
  S.activeDay=S.draft.slots.length?S.draft.slots.slice().sort()[0].split("|")[0]:null;
  go("respond");if(prev)toast("이전 응답을 불러왔어요");}
function pickDay(k){S.activeDay=k;keep();}
function togSlot(s){const k=`${S.activeDay}|${s}`,a=S.draft.slots,i=a.indexOf(k);i>=0?a.splice(i,1):a.push(k);keep();}
function tog(f,v){const a=S.draft[f],i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(v);keep();}
function confirmResp(){if(!S.draft.slots.length){toast("가능한 날짜와 시간대를 하나 이상 골라 주세요");return;}
  const d=S.draft,ppl=S.meeting.people,i=ppl.findIndex(p=>p.id===d.id);i>=0?ppl[i]=d:ppl.push(d);S.meeting._fresh=false;
  document.getElementById("layer").innerHTML=`<div class="dim" role="dialog" aria-modal="true"><div class="pop"><p>응답이 접수되었어요! 🍽️</p><button class="btn btn-primary" onclick="closeLayer();S.joinId='';S.joinNote='';go('dash')">확인</button></div></div>`;}
function closeLayer(){document.getElementById("layer").innerHTML="";}
function rankBlock(gs,f,lab,n){if(!gs.length)return `<p class="rn" style="padding:12px 0">아직 응답이 없어요</p>`;
  return gs.map(g=>g.items.map(x=>`<div class="rk"><p class="rk-t">${g.label} ${esc(lab(x))} <em>${g.votes}표</em>${f==="slots"&&g.rank===1&&g.votes===n?'<span class="badge">만장일치</span>':""}</p><div class="voters">${voters(f,x).map(v=>`<span class="idchip">${esc(v)}</span>`).join("")}</div></div>`).join("")).join("");}
function detail(kind){const R=results(),id=x=>x;let h;
  if(kind==="slots")h=`<h3>날짜 상세</h3><p class="rn">순위별로 고른 사람을 보여줘요</p>${rankBlock(R.dates,"slots",slotLabel,R.n)}`;
  else if(kind==="places")h=`<h3>장소 상세</h3><p class="rn">순위별로 고른 사람을 보여줘요</p>${rankBlock(R.places,"places",id)}`;
  else h=`<h3>메뉴 상세</h3><p class="rn">순위별로 고른 사람을 보여줘요</p><p class="sheet-sec" style="color:var(--like)">🙂 좋아요</p>${rankBlock(R.likes,"likes",id)}<p class="sheet-sec" style="color:var(--rose)">🙁 싫어요</p>${rankBlock(R.dislikes,"dislikes",id)}`;
  document.getElementById("layer").innerHTML=`<div class="dim sheet" onclick="if(event.target===this)closeLayer()"><div class="sheet-box" role="dialog" aria-modal="true"><div class="grab"></div>${h}<button class="btn btn-primary" style="margin-top:16px" onclick="closeLayer()">닫기</button></div></div>`;}
render();
</script>
</body>
</html>
